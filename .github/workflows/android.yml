name: Build SONIX Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sonix-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test
      - run: npm run android:sync
        env:
          VITE_YOUTUBE_API_KEY: ${{ vars.VITE_YOUTUBE_API_KEY }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Prepare persistent app signing
        env:
          ANDROID_SIGNING_STORE_BASE64: ${{ secrets.ANDROID_SIGNING_STORE_BASE64 }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          test -n "$ANDROID_SIGNING_STORE_BASE64" && test -n "$ANDROID_SIGNING_PASSWORD"
          printf '%s' "$ANDROID_SIGNING_STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sonix.p12"
          chmod 600 "$RUNNER_TEMP/sonix.p12"
      - name: Build and check signed APK
        env:
          SONIX_KEYSTORE_PATH: ${{ runner.temp }}/sonix.p12
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          SONIX_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          cd android
          bash gradlew assembleRelease lintRelease --no-daemon
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk ../SONIX.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SONIX-Android-APK
          path: SONIX.apk
          retention-days: 30
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: |
            adb install SONIX.apk
            adb shell am start -W -n io.github.saanku.sonix/.MainActivity
            sleep 15
            adb shell pidof io.github.saanku.sonix
            adb shell uiautomator dump /sdcard/sonix-ui.xml
            adb pull /sdcard/sonix-ui.xml android-ui.xml
            grep -q 'Welcome back' android-ui.xml
            adb exec-out screencap -p > android-screen.png
      - uses: actions/upload-artifact@v4
        with:
          name: SONIX-Android-screen
          path: android-screen.png
      - name: Publish Android test download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view android-test >/dev/null 2>&1; then
            gh release create android-test --target "$GITHUB_SHA" --prerelease --title "SONIX Android test app" --notes "Install SONIX.apk on Android 7 or newer. This is a direct-install test build, not a Google Play release. Sign in with your existing SONIX account."
          fi
          gh release upload android-test SONIX.apk --clobber
      - name: Remove temporary signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/sonix.p12"
