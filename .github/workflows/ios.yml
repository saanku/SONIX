name: Build SONIX iOS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sonix-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run ios:sync
        env:
          VITE_YOUTUBE_API_KEY: ${{ vars.VITE_YOUTUBE_API_KEY }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Build iPhone simulator app
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ios/DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator app
        run: ditto -c -k --sequesterRsrc --keepParent ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app ios/SONIX-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SONIX-iOS-simulator
          path: ios/SONIX-simulator.zip
          retention-days: 14
      - name: Launch in iPhone simulator
        timeout-minutes: 5
        run: |
          xcrun simctl list devices available
          DEVICE=$(xcrun simctl list devices available -j | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const d=Object.entries(JSON.parse(s).devices).filter(([k])=>k.includes('iOS')).sort(([a],[b])=>b.localeCompare(a,undefined,{numeric:true})).flatMap(([,v])=>v).find(d=>d.name.startsWith('iPhone'));if(!d)process.exit(1);process.stdout.write(d.udid)})")
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$DEVICE" io.github.saanku.sonix
          sleep 15
          xcrun simctl io "$DEVICE" screenshot ios/simulator.png
      - uses: actions/upload-artifact@v4
        with:
          name: SONIX-iOS-screenshot
          path: ios/simulator.png
          retention-days: 14
